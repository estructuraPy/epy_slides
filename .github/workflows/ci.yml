# CI - epy_slides (public, MIT).
# One suite dependency, epy_export, which is published on no index:
# the step below installs it from its repository, and no token is
# needed once that repository is public. It is a hard dependency, not
# an extra, so nothing here runs until it resolves.
name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: [self-hosted, Linux, X64, epy-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # Its post-step rewrites .git/config and wedges on this runner.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the job venv
        # Ubuntu 24.04 has no `python` alias and its system pip is externally
        # managed (PEP 668), so every install below targets this venv.
        run: |
          P="$(command -v python || command -v python3)"
          "$P" -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh the local suite mirrors
        # Self-hosted only: $HOME/epy-mirrors holds full bare clones, so pip's
        # git+ specs resolve locally instead of re-cloning the suite per job.
        # A failed fetch stops the job: a stale mirror would lie about main.
        run: |
          MIRRORS="$HOME/epy-mirrors"
          if [ ! -d "$MIRRORS" ]; then
            echo "no local mirrors; installing from GitHub"
            exit 0
          fi
          REPOS="epy_suite epy_units epy_export epy_analysis epy_plotter epy_docs epy_concrete epy_steel epy_timber epy_masonry epy_geotechnical epy_project epy_bridges epy_houses epy_tanks epy_tall epy_structure epy_buildings epy_towers"
          for repo in $REPOS; do
            git config --global --unset-all "url.$MIRRORS/$repo.git.insteadOf" || true
          done
          for repo in $REPOS; do
            git -C "$MIRRORS/$repo.git" fetch origin \
              "+refs/heads/main:refs/heads/main" "+refs/tags/*:refs/tags/*" \
              || { echo "mirror refresh failed: $repo"; exit 1; }
          done
          for repo in $REPOS; do
            git config --global --replace-all "url.$MIRRORS/$repo.git.insteadOf" \
              "https://github.com/estructuraPy/$repo.git"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install ruff
        run: pip install "ruff>=0.11.0"
      - name: ruff check
        run: ruff check .

  typecheck:
    name: Typecheck (pyright)
    runs-on: [self-hosted, Linux, X64, epy-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # Its post-step rewrites .git/config and wedges on this runner.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the job venv
        # Ubuntu 24.04 has no `python` alias and its system pip is externally
        # managed (PEP 668), so every install below targets this venv.
        run: |
          P="$(command -v python || command -v python3)"
          "$P" -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh the local suite mirrors
        # Self-hosted only: $HOME/epy-mirrors holds full bare clones, so pip's
        # git+ specs resolve locally instead of re-cloning the suite per job.
        # A failed fetch stops the job: a stale mirror would lie about main.
        run: |
          MIRRORS="$HOME/epy-mirrors"
          if [ ! -d "$MIRRORS" ]; then
            echo "no local mirrors; installing from GitHub"
            exit 0
          fi
          REPOS="epy_suite epy_units epy_export epy_analysis epy_plotter epy_docs epy_concrete epy_steel epy_timber epy_masonry epy_geotechnical epy_project epy_bridges epy_houses epy_tanks epy_tall epy_structure epy_buildings epy_towers"
          for repo in $REPOS; do
            git config --global --unset-all "url.$MIRRORS/$repo.git.insteadOf" || true
          done
          for repo in $REPOS; do
            git -C "$MIRRORS/$repo.git" fetch origin \
              "+refs/heads/main:refs/heads/main" "+refs/tags/*:refs/tags/*" \
              || { echo "mirror refresh failed: $repo"; exit 1; }
          done
          for repo in $REPOS; do
            git config --global --replace-all "url.$MIRRORS/$repo.git.insteadOf" \
              "https://github.com/estructuraPy/$repo.git"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install the shared engine (not on PyPI)
        # epy_export holds what the four applications were doing
        # identically. It is installed from its repository because
        # it is published nowhere else; without this line pip
        # cannot resolve the dependency and the job fails before a
        # single test runs.
        run: >-
          pip install "epy_export[pdf,qt] @ git+https://github.com/estructuraPy/epy_export.git@v0.3.0"
      - name: Install package + dev deps
        run: pip install -e ".[dev,build]"
      - name: Install the peer extras this repo declares
        # Every extra naming a suite repository (deploy, suite, simulation,
        # ...) is a PEER the tests import; installing the package alone does not
        # pull them, and collection then fails. The git URLs resolve to the
        # mirrors. ifcopenshell is pulled only when the tests mention it.
        shell: bash
        run: |
          set -e
          if grep -qs "ifcopenshell" -r tests; then
            python -m pip install ifcopenshell
          fi
          SPECS=$(grep -oE '"epy[_-][A-Za-z0-9_-]+ @ git\+https://github\.com/estructuraPy/[A-Za-z0-9_.-]+"' pyproject.toml || true)
          printf '%s\n' "$SPECS" | tr -d '"' | sort -u | while IFS= read -r spec; do
            [ -n "$spec" ] && python -m pip install "$spec"
          done
      - name: Install pyright
        run: npm install -g pyright
      # pyrightconfig.json pins pythonPlatform to Windows. typeshed
      # guards winreg behind sys.platform == "win32", so on a Linux
      # runner pyright would resolve the module and none of its
      # attributes -- errors that do not exist on the platform this code
      # runs on. Pinning it also makes this job and a developer's local
      # run evaluate the same configuration, which is the whole point.
      - name: pyright
        run: pyright

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: [self-hosted, Linux, X64, epy-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # Its post-step rewrites .git/config and wedges on this runner.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create the job venv
        # Ubuntu 24.04 has no `python` alias and its system pip is externally
        # managed (PEP 668), so every install below targets this venv.
        run: |
          P="$(command -v python || command -v python3)"
          "$P" -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh the local suite mirrors
        # Self-hosted only: $HOME/epy-mirrors holds full bare clones, so pip's
        # git+ specs resolve locally instead of re-cloning the suite per job.
        # A failed fetch stops the job: a stale mirror would lie about main.
        run: |
          MIRRORS="$HOME/epy-mirrors"
          if [ ! -d "$MIRRORS" ]; then
            echo "no local mirrors; installing from GitHub"
            exit 0
          fi
          REPOS="epy_suite epy_units epy_export epy_analysis epy_plotter epy_docs epy_concrete epy_steel epy_timber epy_masonry epy_geotechnical epy_project epy_bridges epy_houses epy_tanks epy_tall epy_structure epy_buildings epy_towers"
          for repo in $REPOS; do
            git config --global --unset-all "url.$MIRRORS/$repo.git.insteadOf" || true
          done
          for repo in $REPOS; do
            git -C "$MIRRORS/$repo.git" fetch origin \
              "+refs/heads/main:refs/heads/main" "+refs/tags/*:refs/tags/*" \
              || { echo "mirror refresh failed: $repo"; exit 1; }
          done
          for repo in $REPOS; do
            git config --global --replace-all "url.$MIRRORS/$repo.git.insteadOf" \
              "https://github.com/estructuraPy/$repo.git"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install Qt runtime libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install the shared engine (not on PyPI)
        # epy_export holds what the four applications were doing
        # identically. It is installed from its repository because
        # it is published nowhere else; without this line pip
        # cannot resolve the dependency and the job fails before a
        # single test runs.
        run: >-
          pip install "epy_export[pdf,qt] @ git+https://github.com/estructuraPy/epy_export.git@v0.3.0"
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Install the peer extras this repo declares
        # Every extra naming a suite repository (deploy, suite, simulation,
        # ...) is a PEER the tests import; installing the package alone does not
        # pull them, and collection then fails. The git URLs resolve to the
        # mirrors. ifcopenshell is pulled only when the tests mention it.
        shell: bash
        run: |
          set -e
          if grep -qs "ifcopenshell" -r tests; then
            python -m pip install ifcopenshell
          fi
          SPECS=$(grep -oE '"epy[_-][A-Za-z0-9_-]+ @ git\+https://github\.com/estructuraPy/[A-Za-z0-9_.-]+"' pyproject.toml || true)
          printf '%s\n' "$SPECS" | tr -d '"' | sort -u | while IFS= read -r spec; do
            [ -n "$spec" ] && python -m pip install "$spec"
          done
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q

  build:
    name: Build distribution
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, epy-ci]
    steps:
      - uses: actions/checkout@v4
        with:
          # Its post-step rewrites .git/config and wedges on this runner.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the job venv
        # Ubuntu 24.04 has no `python` alias and its system pip is externally
        # managed (PEP 668), so every install below targets this venv.
        run: |
          P="$(command -v python || command -v python3)"
          "$P" -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh the local suite mirrors
        # Self-hosted only: $HOME/epy-mirrors holds full bare clones, so pip's
        # git+ specs resolve locally instead of re-cloning the suite per job.
        # A failed fetch stops the job: a stale mirror would lie about main.
        run: |
          MIRRORS="$HOME/epy-mirrors"
          if [ ! -d "$MIRRORS" ]; then
            echo "no local mirrors; installing from GitHub"
            exit 0
          fi
          REPOS="epy_suite epy_units epy_export epy_analysis epy_plotter epy_docs epy_concrete epy_steel epy_timber epy_masonry epy_geotechnical epy_project epy_bridges epy_houses epy_tanks epy_tall epy_structure epy_buildings epy_towers"
          for repo in $REPOS; do
            git config --global --unset-all "url.$MIRRORS/$repo.git.insteadOf" || true
          done
          for repo in $REPOS; do
            git -C "$MIRRORS/$repo.git" fetch origin \
              "+refs/heads/main:refs/heads/main" "+refs/tags/*:refs/tags/*" \
              || { echo "mirror refresh failed: $repo"; exit 1; }
          done
          for repo in $REPOS; do
            git config --global --replace-all "url.$MIRRORS/$repo.git.insteadOf" \
              "https://github.com/estructuraPy/$repo.git"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install build
        run: pip install build
      # pyproject-build, NOT "python -m build": for -m, sys.path[0] is the
      # working directory, and this repository ships its own build.py at
      # the root -- the PyInstaller driver. "python -m build" therefore
      # runs that instead of the PyPA builder. The console script cannot
      # be shadowed.
      - name: Build sdist + wheel
        run: pyproject-build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
